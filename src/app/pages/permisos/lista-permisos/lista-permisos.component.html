<div [@routeAnimation] class="card card--panel perm-wrapper">
  <header class="perm-head" role="region" aria-label="Sección: Permisos">
    <div class="perm-head__icon" aria-hidden="true">
      <mat-icon>lock</mat-icon>
    </div>
    <div class="perm-head__text">
      <span class="eyebrow">Sección</span>
      <h2>Permisos</h2>
    </div>
    <nav class="perm-head__crumbs" aria-label="Ruta">
      <span class="crumb">Administración</span>
      <span class="sep">/</span>
      <span class="crumb active">Permisos</span>
    </nav>
  </header>
  <div class="surface">
    <div class="d-flex flex-wrap gap-10 justify-content-end w-100">
      <button (click)="limpiarCampos()" mat-flat-button class="bg-success"><i class="fa fa-eraser"></i> Limpiar</button>
      <button (click)="toggleExpandGroups()" mat-flat-button class="bg-warn">
        <i [class]="autoExpandAllGroups ? 'fa fa-expand' : 'fa fa-compress'" aria-hidden="true"></i>
        {{ autoExpandAllGroups ? ' Contraer Grupos' : ' Expandir Grupos' }}
      </button>
      <div *appHasPermission="'17'">
        <button (click)="agregarPermiso()" mat-flat-button class="bg-secondary">
          <i class="fa fa-plus"></i> Agregar</button>
      </div>
      <button type="button" class="mon-hist__btn mon-hist__btn--export" (click)="exportarExcel()">
        <svg class="mon-hist__btn-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3v4a1 1 0 0 0 1 1h4" />
          <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z" />
          <path d="M8 11h8v7H8z" />
          <path d="M8 15h8" />
          <path d="M11 11v7" />
        </svg>
        <span>Exportar</span>
      </button>
    </div>
    <div class="mt-3">
      <dx-data-grid #gridContainer id="gridContainer" class="inm-data-grid" [columnHidingEnabled]="true"
        [hoverStateEnabled]="false" [showBorders]="true" [showColumnLines]="false" [showRowLines]="true"
        [rowAlternationEnabled]="true" [noDataText]="'Sin registros para mostrar'" [dataSource]="listaPermisos"
        [keyExpr]="'idPermiso'" [width]="'100%'" [remoteOperations]="{ paging: true }" [paging]="{ pageSize: pageSize }"
        [pager]="{ 
            showPageSizeSelector: true, 
            allowedPageSizes: [50], 
            showInfo: true,
            infoText: 'Página {0} de {1}', 
            visible: true 
        }" (onPageIndexChanged)=" onPageIndexChanged($event)" (onOptionChanged)="onGridOptionChanged($event)">
        <dxo-search-panel [visible]="true" [width]="200" placeholder="Buscar..."></dxo-search-panel>
        <dxo-toolbar>
          <dxi-item name="groupPanel" location="before"></dxi-item>
          <dxi-item name="exportButton" location="after" [options]="{ text: 'Exportar Grid', icon: 'export' }"
            [showText]="'always'">
          </dxi-item>
          <dxi-item name="searchPanel" location="after"></dxi-item>
        </dxo-toolbar>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[100]" [showInfo]="true"></dxo-pager>
        <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
        <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
        
        <dxo-grouping #expand [autoExpandAll]="autoExpandAllGroups"></dxo-grouping>
        <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
        <dxi-column caption="Acciones" cellTemplate="acciones" alignment="center" *appHasPermission="['19', '18']" [width]="150"></dxi-column>
        <!-- <dxi-column dataField="idPermiso" caption="id" alignment="center" dataType="string" [allowSearch]="true"></dxi-column> -->
        <dxi-column dataField="nombrePermiso" caption="Nombre" alignment="center" dataType="string" [allowSearch]="true"></dxi-column>
        <dxi-column dataField="descripcionPermiso" caption="Descripción" alignment="center" dataType="string" [allowSearch]="true"></dxi-column>
        <dxi-column dataField="nombreModulo" caption="Módulo" alignment="center" dataType="string" [allowSearch]="true">
          <dxo-header-filter [allowSearch]="true"></dxo-header-filter>
        </dxi-column>
        <dxi-column dataField="estatusTexto" caption="Estatus" alignment="center" cellTemplate="est" dataType="string">
          <div *dxTemplate="let f of 'est'">
            @if (f.data.estatus === 1) {
            <span class="estatus estatus-activo">{{ f.data.estatusTexto }}</span>
            } @else {
            <span class="estatus estatus-inactivo">{{ f.data.estatusTexto }}</span>
            }
          </div>
        </dxi-column>
        <div *dxTemplate="let row of 'acciones'" class="d-flex gap-3 justify-content-center">
          <div *appHasPermission="'19'">
            <button valueExpr="idPermiso" id="actualizarButton" class="btnAcciones" (click)="actualizarPermiso(row.data.idPermiso)">
              <i class="fa fa-edit"></i>
            </button>
          </div>
          <div *appHasPermission="'18'">
            @if (row.data.estatus === 0) {
            <button id="pinButton" class="btnAcciones" (click)="activar(row.data)">
              <i class="fa fa-arrow-up"></i>
            </button>
            } @else {
            <button id="deleteButton" class="btnAcciones" (click)="desactivar(row.data)">
              <i class="fa fa-arrow-down"></i>
            </button>
            }
          </div>
        </div>
        <dxo-export [enabled]="false" [allowExportSelectedData]="false"
          [texts]="{ exportAll: 'Exportar todos los datos a Excel' }">
        </dxo-export>
      </dx-data-grid>
    </div>
  </div>
</div>
