<div class="local-perm-field" [hidden]="!show" [attr.aria-hidden]="!show">
  <label *ngIf="label" [attr.for]="fieldId" class="form-label perm-label">{{ label }}</label>
  <div class="input-group input-group-lg perm-ig">
    <span class="input-group-text fw-bold">
      <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
    </span>
    <ng-content></ng-content>
  </div>
  <div class="text-danger small mt-1" *ngIf="error">{{ error }}</div>
</div>
