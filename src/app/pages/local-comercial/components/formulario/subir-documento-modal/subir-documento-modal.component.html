<div class="documento-modal">
  <header class="documento-modal__head">
    <div class="documento-modal__badge" aria-hidden="true">
      <i class="fa fa-file-image-o" *ngIf="!documentoPdfExistente"></i>
      <i class="fa fa-file-pdf-o" *ngIf="documentoPdfExistente"></i>
    </div>
    <div class="documento-modal__head-copy">
      <span class="documento-modal__eyebrow">{{ esSoloLectura ? 'Documento' : 'Documentación' }}</span>
      <div class="documento-modal__title" mat-dialog-title>{{ data.titulo }}</div>
      <p class="documento-modal__hint" *ngIf="!esSoloLectura">
        Seleccione el archivo para adjuntarlo al formulario.
      </p>
      <p class="documento-modal__hint" *ngIf="esSoloLectura">
        Consulte el archivo cargado en este registro.
      </p>
    </div>
  </header>

  <mat-dialog-content class="documento-modal-content">
    <div
      class="documento-modal-preview"
      [class.documento-modal-preview--empty]="mostrarEstadoVacio"
      [class.documento-modal-preview--filled]="tieneVistaPrevia || documentoPdfExistente"
      [class.documento-modal-preview--sin-archivo]="sinArchivoRegistrado && mostrarEstadoVacio">
      <ng-container *ngIf="tieneVistaPrevia">
        <div class="documento-modal-preview-media">
          <img [src]="previewUrl" [alt]="data.titulo" (error)="onErrorVistaPrevia()">
        </div>
        <div class="documento-modal-preview-footer">
          <div class="documento-modal-file" *ngIf="nombreArchivo">
            <i class="fa fa-paperclip"></i>
            <span class="documento-modal-file-name" [title]="nombreArchivo">{{ nombreArchivo }}</span>
          </div>
          <label class="documento-modal-upload documento-modal-upload--inline" *ngIf="!esSoloLectura">
            <input type="file" accept="image/*,.pdf,application/pdf" (change)="onArchivoSeleccionado($event)">
            <span><i class="fa fa-folder-open"></i>&nbsp;Cambiar archivo</span>
          </label>
        </div>
      </ng-container>

      <ng-container *ngIf="documentoPdfExistente && !tieneVistaPrevia">
        <div class="documento-modal-pdf">
          <i class="fa fa-file-pdf-o"></i>
          <span class="documento-modal-pdf-name" [title]="nombreArchivo">{{ nombreArchivo }}</span>
          <a
            *ngIf="urlDocumentoExistente"
            class="documento-modal-pdf-link"
            [href]="urlDocumentoExistente"
            target="_blank"
            rel="noopener noreferrer">
            Ver documento
          </a>
        </div>
        <div class="documento-modal-preview-footer" *ngIf="!esSoloLectura">
          <label class="documento-modal-upload documento-modal-upload--inline">
            <input type="file" accept="image/*,.pdf,application/pdf" (change)="onArchivoSeleccionado($event)">
            <span><i class="fa fa-folder-open"></i>&nbsp;Cambiar archivo</span>
          </label>
        </div>
      </ng-container>

      <ng-container *ngIf="mostrarEstadoVacio">
        <i class="fa" [ngClass]="sinArchivoRegistrado ? 'fa-file-o' : 'fa-file-image-o'"></i>
        <span class="documento-modal-empty-text">{{ mensajeSinArchivo }}</span>
        <span class="documento-modal-empty-subtext" *ngIf="sinArchivoRegistrado">
          Este documento no ha sido cargado en la licencia.
        </span>
        <label class="documento-modal-upload documento-modal-upload--inline" *ngIf="!esSoloLectura">
          <input type="file" accept="image/*,.pdf,application/pdf" (change)="onArchivoSeleccionado($event)">
          <span><i class="fa fa-folder-open"></i>&nbsp;{{ textoBotonSeleccion }}</span>
        </label>
      </ng-container>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="documento-modal-actions" align="end">
    <button type="button" class="button-danger" (click)="cancelar()">
      <i class="fa fa-times">&nbsp;&nbsp;</i>{{ esSoloLectura ? 'Cerrar' : 'Cancelar' }}
    </button>
    <button
      *ngIf="!esSoloLectura"
      type="button"
      class="button-success"
      [disabled]="!archivoSeleccionado"
      (click)="subir()">
      <i class="fa fa-upload"></i>&nbsp;&nbsp;Subir
    </button>
  </mat-dialog-actions>
</div>
