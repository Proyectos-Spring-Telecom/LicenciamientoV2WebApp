<div [@routeAnimation] class="card card--panel perm-wrapper">
  <header class="perm-head perm-head--left" role="region" aria-label="Sección: Locales Comerciales">
    <div class="perm-head__icon" aria-hidden="true">
      <mat-icon>storefront</mat-icon>
    </div>
    <div class="perm-head__text">
      <span class="eyebrow">{{title}}</span>
      <h2>{{titulo}}</h2>
    </div>
    <nav class="perm-head__crumbs" aria-label="Ruta">
      <span class="crumb">{{title}}</span>
      <span class="sep">/</span>
      <span class="crumb active">{{titulo}}</span>
    </nav>
  </header>
  <div class="surface">
    <section class="perm-form-nc container-fluid py-4">
        <form [formGroup]="localForm" class="perm-form-body">
          <div #formTop class="local-tab-header local-form-general-header" [ngClass]="activeTabHeader.css">
            <div class="local-form-general-header__row">
              <div class="local-tab-header__title"><u>{{ activeTabHeader.title }}</u></div>
              <button type="button" class="button-back local-form-general-header__back" (click)="redirigir()">
                <i class="fa fa-arrow-left"></i>&nbsp;&nbsp;Regresar
              </button>
            </div>
            <div class="local-tab-header__subtitle">{{ activeTabHeader.subtitle }}</div>
          </div>
          <div class="local-form-tabs" role="tablist">
            <button type="button" class="local-form-tab local-form-tab--sapac" role="tab"
              [class.is-active]="activeTab === 0" [attr.aria-selected]="activeTab === 0" (click)="setActiveTab(0)">
              <span class="local-form-tab__step">1</span>
              <span class="local-form-tab__label">Sapac</span>
            </button>
            <button type="button" class="local-form-tab local-form-tab--catastral" role="tab"
              [class.is-active]="activeTab === 1" [attr.aria-selected]="activeTab === 1" (click)="setActiveTab(1)">
              <span class="local-form-tab__step">2</span>
              <span class="local-form-tab__label">Catastral</span>
            </button>
            <button type="button" class="local-form-tab local-form-tab--licenciamiento" role="tab"
              [class.is-active]="activeTab === 2" [attr.aria-selected]="activeTab === 2" (click)="setActiveTab(2)">
              <span class="local-form-tab__step">3</span>
              <span class="local-form-tab__label">Licenciamiento</span>
            </button>
            <button type="button" class="local-form-tab local-form-tab--proteccion" role="tab"
              [class.is-active]="activeTab === 3" [attr.aria-selected]="activeTab === 3" (click)="setActiveTab(3)">
              <span class="local-form-tab__step">4</span>
              <span class="local-form-tab__label">Protección Civil</span>
            </button>
          </div>

          <div #tabPanels class="local-form-tab-panels" [@localFormTabPanel]="activeTab"
            (@localFormTabPanel.done)="onTabPanelAnimationDone()"
            [style.min-height.px]="activeTabPanelMinHeight || null">

            <!-- TAB 0: Sapac -->
            <div class="local-form-tab-panel" role="tabpanel" *ngIf="activeTab === 0">
              <div class="local-form-tab-content">
                <div class="row g-4 mt-2">
                  <app-local-perm-field label="Número de Cuenta" icon="numbers" fieldId="numeroCuenta">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="NumeroCuenta" class="form-control" id="numeroCuenta" placeholder="Número de Cuenta">
                      <label for="numeroCuenta">Número de Cuenta</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Nombre" icon="person" fieldId="nombreSapac">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreSapac" class="form-control" id="nombreSapac" placeholder="Nombre">
                      <label for="nombreSapac">Nombre</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Paterno" icon="badge" fieldId="apellidoPaternoSapac">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ApellidoPaternoSapac" class="form-control" id="apellidoPaternoSapac" placeholder="Apellido Paterno">
                      <label for="apellidoPaternoSapac">Apellido Paterno</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Materno" icon="badge" fieldId="apellidoMaternoSapac">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ApellidoMaternoSapac" class="form-control" id="apellidoMaternoSapac" placeholder="Apellido Materno">
                      <label for="apellidoMaternoSapac">Apellido Materno</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="RFC" icon="account_circle" fieldId="rfcSapac">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RfcSapac" class="form-control" id="rfcSapac" placeholder="RFC" maxlength="13"
                        (keypress)="blockNonAlphanumericKey($event)" (input)="onRfcInput($event, 'RfcSapac')">
                      <label for="rfcSapac">RFC</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Estado" icon="map" fieldId="estadoSapac">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="estadoSapac" formControlName="IdEntidadFederativaSapac"
                        (change)="onEstadoSapacChange()" #EstadoSapac>
                        <option *ngFor="let estado of estadosRegistros" [ngValue]="estado.id">{{ estado.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Municipio" icon="signpost" fieldId="municipioSapac">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="municipioSapac" formControlName="IdMunicipioSapac"
                        (change)="onMunicipioSapacChange(MunicipioSapac.value)" #MunicipioSapac>
                        <option *ngFor="let municipio of municipiosRegistros" [ngValue]="municipio.id">{{ municipio.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Localidad" icon="flag" fieldId="localidadSapac">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="localidadSapac" formControlName="IdLocalidadSapac"
                        (change)="onLocalidadSapacChange(LocalidadSapac.value)" #LocalidadSapac>
                        <option *ngFor="let localidad of localidadesRegistros" [ngValue]="localidad.id">{{ localidad.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Localidad" icon="flag" fieldId="nombreLocalidadSapac" *ngIf="esOtroLocalidadSapac()">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreLocalidadSapac" class="form-control" id="nombreLocalidadSapac" placeholder="Localidad"
                        (input)="onNombreLocalidadSapacChange()">
                      <label for="nombreLocalidadSapac">Localidad</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Colonia" icon="location_on" fieldId="coloniaSapac">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="coloniaSapac" formControlName="IdColoniaSapac"
                        (change)="onColoniaSapacChange(ColoniaSapac.value)" #ColoniaSapac>
                        <option *ngFor="let colonia of coloniasRegistros" [ngValue]="colonia.id">{{ colonia.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Colonia" icon="pin" fieldId="nombreColoniaSapac" *ngIf="esOtroColoniaSapac()">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreColoniaSapac" class="form-control" id="nombreColoniaSapac" placeholder="Colonia"
                        (input)="onNombreColoniaSapacChange()">
                      <label for="nombreColoniaSapac">Colonia</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Calle" icon="route" fieldId="calleSapac">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="calleSapac" formControlName="IdCalleSapac"
                        (change)="onCalleSapacChange(CalleSapac.value)" #CalleSapac>
                        <option *ngFor="let calle of callesRegistros" [ngValue]="calle.id">{{ calle.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Calle" icon="route" fieldId="nombreCalleSapac" *ngIf="esOtroCalleSapac()">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreCalleSapac" class="form-control" id="nombreCalleSapac" placeholder="Calle"
                        (input)="onNombreCalleSapacChange()">
                      <label for="nombreCalleSapac">Calle</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="No. Interior" icon="numbers" fieldId="noInteriorSapac">
                    <div class="form-floating flex-grow-1">
                      <input (change)="onChangeEventNI($event)" formControlName="NoInteriorSapac" class="form-control" id="noInteriorSapac" placeholder="No. Interior">
                      <label for="noInteriorSapac">No. Interior</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="No. Exterior" icon="numbers" fieldId="noExteriorSapac">
                    <div class="form-floating flex-grow-1">
                      <input (change)="onChangeEventNE($event)" formControlName="NoExteriorSapac" class="form-control" id="noExteriorSapac" placeholder="No. Exterior">
                      <label for="noExteriorSapac">No. Exterior</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Código Postal" icon="pin" fieldId="cpSapac">
                    <div class="form-floating flex-grow-1">
                      <input maxlength="5" inputmode="numeric" (keypress)="blockNonNumericKey($event)"
                        (input)="onNumericInput($event, 'CPSapac', 5)" (change)="onChangeEventCP($event)"
                        formControlName="CPSapac" class="form-control" id="cpSapac" placeholder="Código Postal">
                      <label for="cpSapac">Código Postal</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Sector" icon="landscape" fieldId="sector">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="Sector" class="form-control" id="sector" placeholder="Sector">
                      <label for="sector">Sector</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Ruta" icon="route" fieldId="ruta">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="Ruta" class="form-control" id="ruta" placeholder="Ruta">
                      <label for="ruta">Ruta</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Folio" icon="tag" fieldId="folio">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="Folio" class="form-control" id="folio" placeholder="Folio">
                      <label for="folio">Folio</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Tipo de Servicio" icon="work" fieldId="idTipoServicio">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="idTipoServicio" formControlName="IdTipoServicio">
                        <option *ngFor="let tipo of tipos" [ngValue]="tipo.id">{{ tipo.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Medidor" icon="straighten" fieldId="medidor">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="Medidor" class="form-control" id="medidor" placeholder="Medidor">
                      <label for="medidor">Medidor</label>
                    </div>
                  </app-local-perm-field>
                </div>
                <div class="local-tab-header__section-label local-tab-header__section-label--images">
                  <i class="fas fa-images"></i>&nbsp;Imágenes
                </div>
                <div class="local-form-uploaders">
                  <app-file-uploader-card *ngFor="let doc of documentosSapac" [label]="doc.titulo" [accept]="doc.accept"
                    [uploadTitle]="doc.uploadTitle" [icon]="doc.icon" [badgeDefault]="doc.badgeDefault"
                    [colorVariant]="doc.buttonClass" [remoteUrl]="documentosExistentes[doc.controlName]"
                    (fileSelected)="onDocumentoSeleccionado(doc.controlName, $event)"
                    (fileRejected)="onDocumentoRechazado(doc.controlName)"
                    (remoteFileClick)="verDocumentoExistente(doc)">
                  </app-file-uploader-card>
                </div>
                <div class="local-form-tab-nav local-form-tab-nav--next-only">
                  <button type="button" class="button-danger" (click)="redirigir()"><i
                      class="fa fa-times">&nbsp;&nbsp;</i>Cancelar</button>
                  <button type="button" class="button-success" (click)="submit()" [disabled]="loading">
                    <span class="loader" *ngIf="loadIndicatorVisible"></span>
                    <i class="fa fa-check"></i>&nbsp;&nbsp;Guardar
                  </button>
                  <button type="button" class="local-form-tab-nav__btn local-form-tab-nav__btn--next"
                    (click)="nextTab()">
                    Siguiente <i class="fa fa-chevron-right"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- TAB 1: Catastral -->
            <div class="local-form-tab-panel" role="tabpanel" *ngIf="activeTab === 1">
              <div class="local-form-tab-content">
                <div class="row g-4 mt-2">
                  <app-local-perm-field label="Clave Catastral" icon="tag" fieldId="clave" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="Clave" class="form-control" id="clave" placeholder="Clave Catastral">
                      <label for="clave">Clave Catastral</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Metros Cuadrados M²" icon="straighten" fieldId="m2" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="M2" class="form-control" id="m2" placeholder="Metros Cuadrados M²">
                      <label for="m2">Metros Cuadrados M²</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Superficie" icon="landscape" fieldId="superficie" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="Superficie" class="form-control" id="superficie" placeholder="Superficie">
                      <label for="superficie">Superficie</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Uso de Suelo" icon="work" fieldId="usoSuelo" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="UsoSuelo" class="form-control" id="usoSuelo" placeholder="Uso de Suelo">
                      <label for="usoSuelo">Uso de Suelo</label>
                    </div>
                  </app-local-perm-field>
                </div>
                <div class="local-tab-header__section-label local-tab-header__section-label--images">
                  <i class="fas fa-images"></i>&nbsp;Imágenes
                </div>
                <div class="local-form-uploaders">
                  <app-file-uploader-card *ngFor="let doc of documentosCatastral" [label]="doc.titulo"
                    [accept]="doc.accept" [uploadTitle]="doc.uploadTitle" [icon]="doc.icon"
                    [badgeDefault]="doc.badgeDefault" [colorVariant]="doc.buttonClass"
                    [remoteUrl]="documentosExistentes[doc.controlName]"
                    (fileSelected)="onDocumentoSeleccionado(doc.controlName, $event)"
                    (fileRejected)="onDocumentoRechazado(doc.controlName)"
                    (remoteFileClick)="verDocumentoExistente(doc)">
                  </app-file-uploader-card>
                </div>
                <div class="local-form-tab-nav">
                  <button type="button" class="local-form-tab-nav__btn" (click)="prevTab()">
                    <i class="fa fa-chevron-left"></i> Anterior
                  </button>
                  <button type="button" class="button-danger" (click)="redirigir()"><i
                      class="fa fa-times">&nbsp;&nbsp;</i>Cancelar</button>
                  <button type="button" class="button-success" (click)="submit()" [disabled]="loading">
                    <span class="loader" *ngIf="loadIndicatorVisible"></span>
                    <i class="fa fa-check"></i>&nbsp;&nbsp;Guardar
                  </button>
                  <button type="button" class="local-form-tab-nav__btn local-form-tab-nav__btn--next"
                    (click)="nextTab()">
                    Siguiente <i class="fa fa-chevron-right"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- TAB 2: Licenciamiento -->
            <div class="local-form-tab-panel" role="tabpanel" *ngIf="activeTab === 2">
              <div class="local-form-tab-content">
                <div class="row g-4 mt-2">
                  <app-local-perm-field label="Registro Municipal" icon="credit_card" fieldId="registro">
                    <div class="form-floating flex-grow-1">
                      <input type="number" formControlName="Registro" class="form-control" id="registro" placeholder="Registro Municipal">
                      <label for="registro">Registro Municipal</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Nombre Comercial" icon="store" fieldId="nombreComercial"
                    [error]="localForm.get('NombreComercial')?.invalid && (localForm.get('NombreComercial')?.touched || submitted) ? 'Campo requerido' : ''">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreComercial" class="form-control" id="nombreComercial" placeholder="Nombre Comercial" required>
                      <label for="nombreComercial">Nombre Comercial</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Giro" icon="store" fieldId="tipo">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="tipo" aria-placeholder="Giro" formControlName="IdGiro">
                        <option *ngFor="let giro of giros" [ngValue]="giro.id">{{ giro.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Licencias de Uso de Suelo" icon="badge" fieldId="licenciaSuelo">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="LicenciaSuelo" class="form-control" id="licenciaSuelo" placeholder="Licencias de Uso de Suelo">
                      <label for="licenciaSuelo">Licencias de Uso de Suelo</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Nombre del Propietario" icon="person" fieldId="nombre">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="Nombre" class="form-control" id="nombre" placeholder="Nombre del Propietario">
                      <label for="nombre">Nombre del Propietario</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Paterno del Propietario" icon="badge" fieldId="apellidoPaterno">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ApellidoPaterno" class="form-control" id="apellidoPaterno" placeholder="Apellido Paterno del Propietario">
                      <label for="apellidoPaterno">Apellido Paterno del Propietario</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Materno del Propietario" icon="badge" fieldId="apellidoMaterno">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ApellidoMaterno" class="form-control" id="apellidoMaterno" placeholder="Apellido Materno del Propietario">
                      <label for="apellidoMaterno">Apellido Materno del Propietario</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Tipo Persona" icon="account_circle" fieldId="tipoPersona">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="tipoPersona" formControlName="TipoPersona"
                        (change)="validarTipoPersona(TipoPersona.value); obtenerTipoPersonaSelect(TipoPersona.value)" #TipoPersona>
                        <option *ngFor="let persona of tipoPersona" [ngValue]="persona.valor">{{ persona.tipo }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="RFC" icon="credit_card" fieldId="rfc">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RFC" class="form-control" id="rfc" placeholder="RFC" maxlength="13"
                        (keypress)="blockNonAlphanumericKey($event)" (input)="onRfcInput($event, 'RFC')">
                      <label for="rfc">RFC</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Razón Social" icon="work" fieldId="razonSocial" *ngIf="!fisica" @proteccionEmpresaFields>
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RazonSocial" class="form-control" id="razonSocial" placeholder="Razón Social">
                      <label for="razonSocial">Razón Social</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Representante Legal Nombre" icon="person" fieldId="representanteLegalNombre" *ngIf="!fisica">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RepresentanteLegalNombre" class="form-control" id="representanteLegalNombre" placeholder="Representante Legal Nombre">
                      <label for="representanteLegalNombre">Representante Legal Nombre</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Representante Legal Apellido Paterno" icon="badge" fieldId="representanteLegalPaterno" *ngIf="!fisica">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RepresentanteLegalPaterno" class="form-control" id="representanteLegalPaterno" placeholder="Representante Legal Apellido Paterno">
                      <label for="representanteLegalPaterno">Representante Legal Apellido Paterno</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Representante Legal Apellido Materno" icon="badge" fieldId="representanteLegalMaterno" *ngIf="!fisica">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RepresentanteLegalMaterno" class="form-control" id="representanteLegalMaterno" placeholder="Representante Legal Apellido Materno">
                      <label for="representanteLegalMaterno">Representante Legal Apellido Materno</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Representante Legal Teléfono" icon="phone" fieldId="representanteLegalTelefono" *ngIf="!fisica">
                    <div class="form-floating flex-grow-1">
                      <input maxlength="10" inputmode="numeric" (keypress)="blockNonNumericKey($event)"
                        (input)="onNumericInput($event, 'RepresentanteLegalTelefono', 10)"
                        formControlName="RepresentanteLegalTelefono" class="form-control" id="representanteLegalTelefono" placeholder="Representante Legal Teléfono">
                      <label for="representanteLegalTelefono">Representante Legal Teléfono</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Representante Legal Correo Electrónico" icon="email" fieldId="representanteLegalEmail" *ngIf="!fisica">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RepresentanteLegalEmail" class="form-control" id="representanteLegalEmail" placeholder="Representante Legal Correo Electrónico">
                      <label for="representanteLegalEmail">Representante Legal Correo Electrónico</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Nombre del Contacto" icon="person" fieldId="contactoNombre">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ContactoNombre" class="form-control" id="contactoNombre" placeholder="Nombre del Contacto">
                      <label for="contactoNombre">Nombre del Contacto</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Paterno del Contacto" icon="contact_mail" fieldId="contactoPaterno">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ContactoPaterno" class="form-control" id="contactoPaterno" placeholder="Apellido Paterno del Contacto">
                      <label for="contactoPaterno">Apellido Paterno del Contacto</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Materno del Contacto" icon="contact_mail" fieldId="contactoMaterno">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ContactoMaterno" class="form-control" id="contactoMaterno" placeholder="Apellido Materno del Contacto">
                      <label for="contactoMaterno">Apellido Materno del Contacto</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Teléfono del Contacto" icon="phone" fieldId="contactoTelefono">
                    <div class="form-floating flex-grow-1">
                      <input maxlength="10" inputmode="numeric" (keypress)="blockNonNumericKey($event)"
                        (input)="onNumericInput($event, 'ContactoTelefono', 10)" formControlName="ContactoTelefono"
                        class="form-control" id="contactoTelefono" placeholder="Teléfono del Contacto">
                      <label for="contactoTelefono">Teléfono del Contacto</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Correo Electrónico del Contacto" icon="email" fieldId="contactoEmail">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ContactoEmail" class="form-control" id="contactoEmail" placeholder="Correo Electrónico del Contacto">
                      <label for="contactoEmail">Correo Electrónico del Contacto</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Fecha de Expedición" icon="calendar_month" fieldId="fechaExpedicion">
                    <div class="form-floating flex-grow-1">
                      <input type="date" formControlName="FechaExpedicion" class="form-control perm-date-input" id="fechaExpedicion">
                      <label for="fechaExpedicion">Fecha de expedición</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Fecha de Refrendo" icon="calendar_month" fieldId="fechaRefrendo">
                    <div class="form-floating flex-grow-1">
                      <input type="date" formControlName="FechaRefrendo" class="form-control perm-date-input" id="fechaRefrendo">
                      <label for="fechaRefrendo">Fecha de refrendo</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Estado" icon="map" fieldId="estadoLicencia">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="estadoLicencia" formControlName="IdEntidadFederativaLicencia"
                        (change)="onEstadoLicenciaChange()" #EstadoLicencia>
                        <option *ngFor="let estado of estadosRegistros" [ngValue]="estado.id">{{ estado.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Municipio" icon="signpost" fieldId="municipioLicencia">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="municipioLicencia" formControlName="IdMunicipioLicencia"
                        (change)="onMunicipioLicenciaChange(MunicipioLicencia.value)" #MunicipioLicencia>
                        <option *ngFor="let municipio of municipioRegistros" [ngValue]="municipio.id">{{ municipio.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Localidad" icon="flag" fieldId="localidadLicencia">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="localidadLicencia" formControlName="IdLocalidadLicencia"
                        (change)="onLocalidadLicenciaChange(LocalidadLicencia.value)" #LocalidadLicencia>
                        <option *ngFor="let localidad of localidadeRegistros" [ngValue]="localidad.id">{{ localidad.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Localidad" icon="flag" fieldId="nombreLocalidadLicencia" *ngIf="esOtroLocalidadLicencia()">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreLocalidadLicencia" class="form-control" id="nombreLocalidadLicencia" placeholder="Localidad"
                        (input)="onNombreLocalidadLicenciaChange()">
                      <label for="nombreLocalidadLicencia">Localidad</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Colonia" icon="location_on" fieldId="coloniaLicencia">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="coloniaLicencia" formControlName="IdColoniaLicencia"
                        (change)="onColoniaLicenciaChange(ColoniaLicencia.value)" #ColoniaLicencia>
                        <option *ngFor="let colonia of coloniaRegistros" [ngValue]="colonia.id">{{ colonia.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Colonia" icon="pin" fieldId="nombreColoniaLicencia" *ngIf="esOtroColoniaLicencia()">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreColoniaLicencia" class="form-control" id="nombreColoniaLicencia" placeholder="Colonia"
                        (input)="onNombreColoniaLicenciaChange()">
                      <label for="nombreColoniaLicencia">Colonia</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Calle" icon="route" fieldId="calleLicencia">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="calleLicencia" formControlName="IdCalleLicencia"
                        (change)="onCalleLicenciaChange(CalleLicencia.value)" #CalleLicencia>
                        <option *ngFor="let calle of calleRegistros" [ngValue]="calle.id">{{ calle.nombre }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Calle" icon="route" fieldId="nombreCalleLicencia" *ngIf="esOtroCalleLicencia()">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreCalleLicencia" class="form-control" id="nombreCalleLicencia" placeholder="Calle"
                        (input)="onNombreCalleLicenciaChange()">
                      <label for="nombreCalleLicencia">Calle</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="No. Interior" icon="numbers" fieldId="nointerior" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1">
                      <input id="nointerior" (change)="onChangeEventNILicencia($event)"
                        formControlName="NoInteriorLicencia" class="form-control" placeholder="No. Interior">
                      <label for="nointerior">No. Interior</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="No. Exterior" icon="numbers" fieldId="noexterior" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1">
                      <input id="noexterior" (change)="onChangeEventNELicencia($event)"
                        formControlName="NoExteriorLicencia" class="form-control" placeholder="No. Exterior">
                      <label for="noexterior">No. Exterior</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Código Postal" icon="pin" fieldId="cplicencia" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1">
                      <input maxlength="5" inputmode="numeric" (keypress)="blockNonNumericKey($event)"
                        (input)="onNumericInput($event, 'CPLicencia', 5)" id="cplicencia"
                        (change)="onChangeEventCPLicencia($event)" formControlName="CPLicencia" class="form-control" placeholder="Código Postal">
                      <label for="cplicencia">Código Postal</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Cuenta con Estacionamiento" icon="local_parking" fieldId="Estacionamiento" colClass="col-12 col-md-3">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="Estacionamiento" formControlName="TieneEstacionamiento"
                        (change)="validarEstacionamiento(Estacionamiento.value)" #Estacionamiento>
                        <option *ngFor="let est of estacionamiento" [ngValue]="est.valor">{{ est.tipo }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                </div>
                <div class="local-tab-header__section-label local-tab-header__section-label--images">
                  <i class="fas fa-images"></i>&nbsp;Imágenes
                </div>
                <div class="local-form-uploaders">
                  <div class="local-form-uploader-item" *ngFor="let doc of documentosLicenciamiento">
                    <app-file-uploader-card [label]="doc.titulo"
                      [accept]="doc.accept" [uploadTitle]="doc.uploadTitle" [icon]="doc.icon"
                      [badgeDefault]="doc.badgeDefault" [colorVariant]="doc.buttonClass"
                      [remoteUrl]="documentosExistentes[doc.controlName]"
                      (fileSelected)="onDocumentoSeleccionado(doc.controlName, $event)"
                      (fileRejected)="onDocumentoRechazado(doc.controlName)"
                      (remoteFileClick)="verDocumentoExistente(doc)">
                    </app-file-uploader-card>
                    <p class="local-form-required-hint"
                      *ngIf="doc.controlName === 'FachadaEstablecimiento' && (submitted || localForm.get('FachadaEstablecimiento')?.touched) && localForm.get('FachadaEstablecimiento')?.invalid">
                      **Es obligatorio insertar la imagen de la fachada del establecimiento
                    </p>
                  </div>
                </div>
                <div class="local-form-tab-nav">
                  <button type="button" class="local-form-tab-nav__btn" (click)="prevTab()">
                    <i class="fa fa-chevron-left"></i> Anterior
                  </button>
                  <button type="button" class="button-danger" (click)="redirigir()"><i
                      class="fa fa-times">&nbsp;&nbsp;</i>Cancelar</button>
                  <button type="button" class="button-success" (click)="submit()" [disabled]="loading">
                    <span class="loader" *ngIf="loadIndicatorVisible"></span>
                    <i class="fa fa-check"></i>&nbsp;&nbsp;Guardar
                  </button>
                  <button type="button" class="local-form-tab-nav__btn local-form-tab-nav__btn--next"
                    (click)="nextTab()">
                    Siguiente <i class="fa fa-chevron-right"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- TAB 3: Protección Civil -->
            <div class="local-form-tab-panel" role="tabpanel" *ngIf="activeTab === 3">
              <div class="local-form-tab-content">
                <div class="row g-4 mt-2">
                  <app-local-perm-field label="Nombre del Representante Legal" icon="person" fieldId="nombreProteccionCivil">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="NombreProteccionCivil" class="form-control" id="nombreProteccionCivil" placeholder="Nombre del Representante Legal">
                      <label for="nombreProteccionCivil">Nombre del Representante Legal</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Paterno del Representante Legal" icon="badge" fieldId="apellidoPaternoProteccionCivil">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ApellidoPaternoProteccionCivil" class="form-control" id="apellidoPaternoProteccionCivil" placeholder="Apellido Paterno del Representante Legal">
                      <label for="apellidoPaternoProteccionCivil">Apellido Paterno del Representante Legal</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Apellido Materno del Representante Legal" icon="badge" fieldId="apellidoMaternoProteccionCivil">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="ApellidoMaternoProteccionCivil" class="form-control" id="apellidoMaternoProteccionCivil" placeholder="Apellido Materno del Representante Legal">
                      <label for="apellidoMaternoProteccionCivil">Apellido Materno del Representante Legal</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Teléfono del Representante Legal" icon="phone" fieldId="telefonoProteccionCivil">
                    <div class="form-floating flex-grow-1">
                      <input maxlength="10" inputmode="numeric" (keypress)="blockNonNumericKey($event)"
                        (input)="onNumericInput($event, 'TelefonoProteccionCivil', 10)"
                        formControlName="TelefonoProteccionCivil" class="form-control" id="telefonoProteccionCivil" placeholder="Teléfono del Representante Legal">
                      <label for="telefonoProteccionCivil">Teléfono del Representante Legal</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="Registro Acreditación" icon="tag" fieldId="registroAcreditacion">
                    <div class="form-floating flex-grow-1">
                      <input formControlName="RegistroAcreditacion" class="form-control" id="registroAcreditacion" placeholder="Registro Acreditación">
                      <label for="registroAcreditacion">Registro Acreditación</label>
                    </div>
                  </app-local-perm-field>
                  <app-local-perm-field label="¿Cuenta con Programa Civil?" icon="work" fieldId="TienePrograma">
                    <div class="form-floating flex-grow-1 perm-select-floating">
                      <select class="form-select" id="TienePrograma" formControlName="TienePrograma"
                        (change)="validarPrograma(programa.value)" #programa>
                        <option *ngFor="let prog of tipoPrograma" [ngValue]="prog.valor">{{ prog.tipo }}</option>
                      </select>
                    </div>
                  </app-local-perm-field>
                </div>
                <div class="result local-form-row-gap">
                  <div class="local-proteccion-empresa-row row g-3">
                    <div class="proteccion-empresa-field fury-flex-form-field col-12 col-md-4">
                      <span>
                        <i class="fas fa-store"></i>&nbsp;¿La gestión la realiza una Empresa?
                      </span>
                      <label class="toggle-switch">
                        <input id="es-empresa-proteccion" type="checkbox" [checked]="checkedBox()"
                          (change)="changeValue($any($event.target).checked)">
                        <div class="toggle-switch-background">
                          <div class="toggle-switch-handle"></div>
                        </div>
                      </label>
                    </div>
                    <app-local-perm-field *ngIf="localForm.get('EsEmpresa')?.value == true" @proteccionEmpresaFields
                      label="Razón Social" icon="work" fieldId="razonSocialProteccionCivil">
                      <div class="form-floating flex-grow-1">
                        <input formControlName="RazonSocialProteccionCivil" class="form-control" id="razonSocialProteccionCivil" placeholder="Razón Social">
                        <label for="razonSocialProteccionCivil">Razón Social</label>
                      </div>
                    </app-local-perm-field>
                    <app-local-perm-field *ngIf="localForm.get('EsEmpresa')?.value == true" @proteccionEmpresaFields
                      label="RFC" icon="account_circle" fieldId="rfcProteccionCivil">
                      <div class="form-floating flex-grow-1">
                        <input formControlName="RfcProteccionCivil" class="form-control" id="rfcProteccionCivil" placeholder="RFC" maxlength="13"
                          (keypress)="blockNonAlphanumericKey($event)" (input)="onRfcInput($event, 'RfcProteccionCivil')">
                        <label for="rfcProteccionCivil">RFC</label>
                      </div>
                    </app-local-perm-field>
                  </div>
                </div>
                <div class="local-tab-header__section-label local-tab-header__section-label--images mt-1">
                  <i class="fas fa-images"></i>&nbsp;Imágenes
                </div>
                <div class="local-form-uploaders">
                  <app-file-uploader-card *ngFor="let doc of documentosProteccion" [label]="doc.titulo"
                    [accept]="doc.accept" [uploadTitle]="doc.uploadTitle" [icon]="doc.icon"
                    [badgeDefault]="doc.badgeDefault" [colorVariant]="doc.buttonClass"
                    [remoteUrl]="documentosExistentes[doc.controlName]"
                    (fileSelected)="onDocumentoSeleccionado(doc.controlName, $event)"
                    (fileRejected)="onDocumentoRechazado(doc.controlName)"
                    (remoteFileClick)="verDocumentoExistente(doc)">
                  </app-file-uploader-card>
                </div>
                <div class="local-form-tab-nav local-form-tab-nav--end">
                  <button type="button" class="local-form-tab-nav__btn" (click)="prevTab()">
                    <i class="fa fa-chevron-left"></i> Anterior
                  </button>
                  <button type="button" class="button-danger" (click)="redirigir()"><i
                      class="fa fa-times">&nbsp;&nbsp;</i>Cancelar</button>
                  <button type="button" class="button-success" (click)="submit()" [disabled]="loading">
                    <span class="loader" *ngIf="loadIndicatorVisible"></span>
                    <i class="fa fa-check"></i>&nbsp;&nbsp;Guardar
                  </button>
                </div>
              </div>
            </div>

          </div>
        </form>
    </section>
  </div>
</div>
